# CI for omnigate. Seven jobs, all on Linux:
#
#   dataplane   Zig unit tests and a build of the data plane. Zig is installed
#               the way dataplane/Dockerfile installs it: downloaded from
#               ziglang.org and checked against the SHA-256 that file pins
#               (see .github/actions/setup-zig).
#   control     Formatting check (`mix format --check-formatted`) and Elixir
#               unit tests of the control plane (`mix test`).
#   tools       Unit tests of the LiteLLM importer (Python, stdlib only).
#   e2e         tools/e2e.py: mock providers, the control plane and the data
#               plane as local processes, checked end to end. Runs only if the
#               two unit-test jobs pass. The data plane is built again in this
#               job rather than passed along as an artifact: a default
#               `zig build` targets the CPU of the machine it runs on, and two
#               jobs are not guaranteed to get the same CPU model.
#   sdk         tools/sdk_compat.py: the same local stack as the text half of
#               e2e, driven through the official OpenAI and Anthropic Python
#               SDKs. The two SDKs are installed from PyPI at the versions
#               pinned in OPENAI_SDK_VERSION and ANTHROPIC_SDK_VERSION below
#               (the job log prints which); they are the only third-party
#               Python packages any job installs. Runs only if the two
#               unit-test jobs pass.
#   hostile     tools/malformed_test.py: the same local stack as e2e, started
#               by the tool itself through the harness in tools/e2e.py, and
#               sent malformed, ambiguous and smuggling requests over raw
#               sockets; the gateway must answer /healthz after every one.
#               It then checks that a client which hangs up mid-stream is
#               still billed. Runs only if the two unit-test jobs pass.
#   containers  tools/container_test.py --compose: builds both images, starts
#               compose.yaml (plus mock providers) and checks it through the
#               TLS proxy, including malformed requests and odd spellings of
#               guarded paths sent byte for byte through the proxy.
#
# None of the jobs needs a secret or an API key: every provider is a mock.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "29"
  ELIXIR_VERSION: "1.20.5"
  PYTHON_VERSION: "3.12"
  # The SDK releases tools/sdk_compat.py was written against. Pinned so that a
  # new SDK release cannot turn CI red without a change in this repository.
  # To bump them: change the two numbers here in a pull request of its own,
  # let the sdk job run, and fix whatever the newer SDK notices (in the
  # gateway if it is a real incompatibility, in tools/sdk_compat.py if the
  # SDK only renamed something). Check the newer versions locally first with
  #   pip install openai==<new> anthropic==<new> && python tools/sdk_compat.py
  # and update the versions named in CONTRIBUTING.md, docs/quickstart.md and
  # docs/api.md in the same pull request.
  OPENAI_SDK_VERSION: "3.49.0"
  ANTHROPIC_SDK_VERSION: "2.8.0"
  # tools/e2e.py decrypts the gateway's age files with this (the Python
  # binding of the Rust implementation of age).
  PYRAGE_VERSION: "1.4.0"

jobs:
  dataplane:
    name: Data plane (Zig)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-zig

      - name: Unit tests
        working-directory: dataplane
        run: zig build test --summary all

      - name: Build
        working-directory: dataplane
        run: zig build

  control:
    name: Control plane (Elixir)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache dependencies and their build
        uses: actions/cache@v6
        with:
          path: |
            control/deps
            control/_build
          key: mix-test-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('control/mix.lock') }}

      - name: Fetch dependencies
        working-directory: control
        run: mix deps.get

      # control/.formatter.exs sets the line length the code is written to.
      - name: Formatting
        working-directory: control
        run: mix format --check-formatted

      - name: Unit tests
        working-directory: control
        run: mix test

  tools:
    name: Tools (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: LiteLLM importer tests
        run: python tools/test_import_litellm.py

      - name: Receipt verifier against RFC 8032's Ed25519 vectors
        run: python tools/verify_receipt.py --self-test

      - name: Site builds and every link between its pages holds
        run: |
          pip install -r site/requirements.txt
          python site/build.py

  e2e:
    name: End to end (mock providers)
    needs: [dataplane, control]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-zig

      # tools/e2e.py runs dataplane/zig-out/bin/omnigate-dp.
      - name: Build the data plane
        working-directory: dataplane
        run: zig build

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache dependencies and their build
        uses: actions/cache@v6
        with:
          path: |
            control/deps
            control/_build
          key: mix-dev-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('control/mix.lock') }}

      # tools/e2e.py starts the control plane with `mix run --no-halt` and
      # waits for its port; compiling first keeps that wait short.
      - name: Fetch and compile the control plane
        working-directory: control
        run: |
          mix deps.get
          mix compile

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # An independent implementation of the age format (the Python binding
      # of the Rust one): the test decrypts with it what the gateway
      # encrypted. Optional on a developer's machine, required here.
      - name: Install pyrage
        run: python -m pip install "pyrage==${PYRAGE_VERSION}"

      # Listens on 127.0.0.1 only: 9001-9005 and 9101-9110 (mocks), 14000
      # (control plane), 18080 (gateway). State and logs go to a directory
      # named omnigate-e2e-* under TMPDIR.
      - name: End-to-end test
        env:
          TMPDIR: ${{ runner.temp }}
          OMNIGATE_REQUIRE_PYRAGE: "1"
        run: python tools/e2e.py

      - name: Upload logs and state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/omnigate-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  sdk:
    name: Official SDKs (mock providers)
    needs: [dataplane, control]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-zig

      # tools/sdk_compat.py uses the harness in tools/e2e.py, which runs
      # dataplane/zig-out/bin/omnigate-dp.
      - name: Build the data plane
        working-directory: dataplane
        run: zig build

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Same key as the e2e job: both compile the control plane in the dev
      # environment, so either job's cache serves the other.
      - name: Cache dependencies and their build
        uses: actions/cache@v6
        with:
          path: |
            control/deps
            control/_build
          key: mix-dev-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('control/mix.lock') }}

      # The harness starts the control plane with `mix run --no-halt` and
      # waits for its port; compiling first keeps that wait short.
      - name: Fetch and compile the control plane
        working-directory: control
        run: |
          mix deps.get
          mix compile

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned (see the env block at the top for how to bump them): the suite
      # asserts on SDK behaviour, so an SDK release must be a deliberate
      # change here, not something that arrives by itself. The test prints
      # the versions it ran.
      - name: Install the OpenAI and Anthropic SDKs
        run: python -m pip install "openai==${OPENAI_SDK_VERSION}" "anthropic==${ANTHROPIC_SDK_VERSION}"

      # Listens on 127.0.0.1 only: 9001-9005 (text mocks), 14000 (control
      # plane), 18080 (gateway). State and logs go to a directory named
      # omnigate-sdk-* under TMPDIR. Every case must pass: the test has no
      # known-gap mode.
      - name: SDK compatibility test
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tools/sdk_compat.py

      - name: Upload logs and state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-logs
          path: ${{ runner.temp }}/omnigate-sdk-*
          if-no-files-found: ignore
          retention-days: 7

  hostile:
    name: Hostile input (mock providers)
    needs: [dataplane, control]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-zig

      # tools/malformed_test.py uses the harness in tools/e2e.py, which runs
      # dataplane/zig-out/bin/omnigate-dp. An unoptimized build on purpose,
      # as in the e2e job: it keeps every safety check, so an out-of-bounds
      # index or a failed assertion is a crash the test sees.
      - name: Build the data plane
        working-directory: dataplane
        run: zig build

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      # Same key as the e2e and sdk jobs: all three compile the control plane
      # in the dev environment, so any job's cache serves the others.
      - name: Cache dependencies and their build
        uses: actions/cache@v6
        with:
          path: |
            control/deps
            control/_build
          key: mix-dev-${{ runner.os }}-otp-${{ steps.beam.outputs.otp-version }}-elixir-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('control/mix.lock') }}

      # The harness starts the control plane with `mix run --no-halt` and
      # waits for its port; compiling first keeps that wait short.
      - name: Fetch and compile the control plane
        working-directory: control
        run: |
          mix deps.get
          mix compile

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Without --gateway the tool starts its own stack and stops it again.
      # Listens on 127.0.0.1 only: 9001-9005 (text mocks), 14000 (control
      # plane), 18080 (gateway), 9006 (an upstream inside the tool that breaks
      # connections), and for the hostile control plane 4300 (a stand-in
      # inside the tool) and 8190 (a second gateway pointed at it).
      # State and logs go to a directory named omnigate-malformed-* under
      # TMPDIR; it is kept when a case fails.
      # The generated cases use the tool's default seed and count, so a
      # failure here can be replayed locally with the same command (the seed
      # is printed).
      - name: Hostile-input test
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tools/malformed_test.py

      - name: Upload logs and state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hostile-logs
          path: ${{ runner.temp }}/omnigate-malformed-*
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Containers (Compose, TLS proxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Docker and Compose versions
        run: |
          docker version
          docker compose version

      # Builds both images (the data-plane build also runs the Zig unit
      # tests), publishes two ports on 127.0.0.1 (18443, and 18444 for a
      # second proxy with a closed admin allow-list), and removes everything
      # it created when it is done. It prints container logs itself when a
      # check fails.
      - name: Container test
        run: python3 tools/container_test.py --compose

      - name: What was left running
        if: failure()
        run: docker ps -a
