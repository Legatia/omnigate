# omnigate on Kubernetes: `kubectl apply -k deploy/kubernetes` after creating
# the two Secrets and the ConfigMap these manifests name (docs/kubernetes.md).
#
# To run another version, or images of your own, add to an overlay:
#
#   images:
#     - name: ghcr.io/legatia/omnigate-control
#       newTag: 1.3.0
#     - name: ghcr.io/legatia/omnigate-dataplane
#       newTag: 1.3.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - control.yaml
  - dataplane.yaml
